name: Build Domino Score APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q DominoScore_FinalBuild.zip -d project
          test -f project/DominoScore_FinalBuild/settings.gradle.kts
          test -f project/DominoScore_FinalBuild/app/build.gradle.kts
          echo "Project files found"

      - name: Build Debug APK
        working-directory: project/DominoScore_FinalBuild
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s project/DominoScore_FinalBuild/app/build/outputs/apk/debug/app-debug.apk
          ls -lh project/DominoScore_FinalBuild/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DominoScore-debug
          path: project/DominoScore_FinalBuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
