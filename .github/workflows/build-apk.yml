name: Build Domino Score APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q DominoScore_Pro_V2_CloudBuild.zip -d project

      - name: Check project
        run: |
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts
          echo "Project files found"

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DominoScore-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
